<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para mi vida ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(180deg, #ffe4e1, #ffd1dc);
    color: #d63447;
    text-align: center;
    overflow: hidden;
}

/* CONTENEDOR PRINCIPAL */
.container {
    max-width: 600px;
    margin: 90px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,.15);
    position: relative;
    z-index: 2;
}

.hidden {
    display: none;
}

button {
    background-color: #d63447;
    color: white;
    padding: 12px 22px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    font-size: 16px;
}

button:hover {
    background-color: #a52a3c;
}

/* ❤️ CORAZONES */
.heart {
    position: fixed;
    bottom: -40px;
    font-size: 22px;
    animation: floatHeart linear infinite;
    pointer-events: none;
}

@keyframes floatHeart {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-120vh) scale(1.4);
        opacity: 0;
    }
}

/* 🌑 OVERLAY GIFS */
#gif-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
}

/* 📱 GIFS EN FILA */
.gif-wrapper {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding: 20px;
    scroll-snap-type: x mandatory;
    max-width: 100vw;
}

.gif-wrapper img {
    width: 240px;
    border-radius: 18px;
    scroll-snap-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,.5);
}

/* TEXTO */
.swipe-text {
    color: white;
    opacity: 0.8;
    font-size: 14px;
    margin-top: 10px;
}

/* BOTÓN RESET */
.reset-btn {
    margin-top: 20px;
    background: #d63447;
}

/* POPUP NO */
#no-popup {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    color: #d63447;
    padding: 15px 22px;
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,.2);
    display: none;
    z-index: 2000;
}
</style>
</head>

<body>

<div class="container">
    <h1>Hola mi chamaquitaaa ❤️</h1>
    <p>Quería hacerte una pregunta…</p>
    <button onclick="showQuestion()">Pícale aquí</button>

    <div id="question" class="hidden">
        <h2>Quiero pasar todos los 14 de febrero contigo</h2>
        <p>¿Quieres ser mi San Valentine? 💖</p>
        <button onclick="yes()">Por supuesto 💕</button>
        <button onclick="no()">Nombre 😢</button>
    </div>
</div>

<!-- 🌑 GIF OVERLAY -->
<div id="gif-overlay">
    <div class="gif-wrapper">
        <img src="gif1.gif">
        <img src="gif2.gif">
        <img src="gif3.gif">
    </div>
    <div class="swipe-text">Desliza 💕</div>
    <button class="reset-btn" onclick="resetAll()">Regresar 💖</button>
</div>

<!-- POPUP NO -->
<div id="no-popup">Ándale… dime que sí 🥺💖</div>

<script>
let heartInterval = null;

/* MOSTRAR PREGUNTA */
function showQuestion() {
    document.getElementById("question").classList.remove("hidden");
}

/* CREAR CORAZONES */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (18 + Math.random() * 24) + "px";
    heart.style.animationDuration = (6 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
}

/* SI */
function yes() {
    if (!heartInterval) {
        heartInterval = setInterval(createHeart, 250);
    }

    setTimeout(() => {
        document.getElementById("gif-overlay").style.display = "flex";
    }, 800);
}

/* NO */
function no() {
    const popup = document.getElementById("no-popup");
    popup.style.display = "block";
    setTimeout(() => popup.style.display = "none", 2500);
}

/* RESET TOTAL */
function resetAll() {
    document.getElementById("gif-overlay").style.display = "none";
    document.getElementById("question").classList.add("hidden");

    if (heartInterval) {
        clearInterval(heartInterval);
        heartInterval = null;
    }

    document.querySelectorAll(".heart").forEach(h => h.remove());
}
</script>

</body>
</html>
