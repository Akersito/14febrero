<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>¿Quieres ser mi Valentine?</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    }
    .card {
      background: white;
      border-radius: 24px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 1.2s ease;
    }
    h1 {
      color: #e63946;
      margin-bottom: 10px;
      font-size: 2.2rem;
    }
    p {
      color: #333;
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 30px;
    }
    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }
    .yes {
      background: #e63946;
      color: white;
    }
    .no {
      background: #f1f1f1;
      color: #333;
    }
    .message {
      margin-top: 25px;
      font-size: 1.2rem;
      color: #e63946;
      display: none;
      animation: fadeIn 0.6s ease;
    }
    .heart {
      font-size: 2.5rem;
      animation: beat 1.2s infinite;
      margin-bottom: 15px;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>Amor</h1>
    <p>
      Desde que llegaste a mi vida, todo tiene más sentido.
      <br />
      Este 14 de febrero no sería lo mismo sin ti.
    </p>
    <p><strong>¿Quieres ser mi Valentine?</strong></p>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">Sí, obvio 💕</button>
      <button class="no" onclick="moveNo(this)">No 🙈</button>
    </div>
    
  </div>

  <script>
    function sayYes() {
      createHearts();
      const popup = document.createElement('div');
      popup.innerHTML = `
        <div style="
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.5);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 9999;
        ">
          <div style="
            background: white;
            padding: 35px 30px;
            border-radius: 20px;
            max-width: 380px;
            text-align: center;
            box-shadow:0 20px 40px rgba(0,0,0,0.25);
            animation: fadeIn 0.5s ease;
          ">
            <h2 style="color:#e63946; margin-bottom:10px;">🥰 Sabía que dirías que sí</h2>
            <p style="font-size:1.1rem; color:#333;">
              Gracias por ser mi lugar seguro, mi amor.
              <br><br>
              No puedo esperar para pasar este Valentine contigo 💖
            </p>
            <button onclick="closePopupAndShowImages()" style="
              margin-top:20px;
              background:#e63946;
              color:white;
              border:none;
              padding:12px 26px;
              border-radius:999px;
              font-size:1rem;
              cursor:pointer;
            ">Cerrar 💕</button>
          </div>
        </div>
      `;
      document.body.appendChild(popup);
    }

    function createHearts() {
      for (let i = 0; i < 35; i++) {
        const heart = document.createElement('div');
        heart.innerHTML = '❤️';
        heart.style.position = 'fixed';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.bottom = '-20px';
        heart.style.fontSize = Math.random() * 22 + 14 + 'px';
        heart.style.animation = 'floatUp 4s linear forwards';
        heart.style.zIndex = 500;
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
      }
    }

    const style = document.createElement('style');
    style.innerHTML = `
      @keyframes floatUp {
        from { transform: translateY(0); opacity: 1; }
        to { transform: translateY(-100vh); opacity: 0; }
      }
    `;
    document.head.appendChild(style);

    function closePopupAndShowImages() {
      const overlay = document.querySelector('body > div:last-child');
      if (overlay) overlay.remove();

      const popup = document.createElement('div');
      popup.innerHTML = `
        <div style="
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.65);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10000;
        ">
          <div style="
            background: #ffe6f0;
            border-radius: 24px;
            padding: 20px;
            max-width: 95%;
            width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease;
          ">
            <div style="
              display: flex;
              gap: 14px;
              overflow-x: auto;
              scroll-snap-type: x mandatory;
              -webkit-overflow-scrolling: touch;
            ">
              <img src="gif1.gif" style="scroll-snap-align:center; flex: 0 0 auto; width: 280px; border-radius: 20px;" />
              <img src="gif2.gif" style="scroll-snap-align:center; flex: 0 0 auto; width: 280px; border-radius: 20px;" />
              <img src="gif3.gif" style="scroll-snap-align:center; flex: 0 0 auto; width: 280px; border-radius: 20px;" />
            </div>
            <p style="text-align:center; margin-top:12px; color:#e63946; font-weight:600;">Desliza 💕</p>
            <button onclick="this.closest('div').parentElement.remove()" style="
              display:block;
              margin: 10px auto 0;
              background:#e63946;
              color:white;
              border:none;
              padding:12px 26px;
              border-radius:999px;
              font-size:1rem;
              cursor:pointer;
            ">Cerrar 💕</button>
          </div>
        </div>
      `;

      document.body.appendChild(popup);
    }

    function openImagePopup(src) {
      const popup = document.createElement('div');
      popup.innerHTML = `
        <div style="
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,0.7);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 10000;
        ">
          <img src="${src}" style="max-width:90%; max-height:80%; border-radius:20px; box-shadow:0 20px 40px rgba(0,0,0,0.4); animation: fadeIn 0.4s ease;" />
        </div>
      `;
      popup.onclick = () => popup.remove();
      document.body.appendChild(popup);
    }

    function moveNo(btn) {
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
