<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mi Amor</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: linear-gradient(180deg, #ffe4e1, #ffd1dc);
    color: #d63447;
    margin: 0;
    overflow: hidden;
}

/* CONTENEDOR */
.container {
    max-width: 600px;
    margin: 80px auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 20px 40px rgba(0,0,0,.15);
    z-index: 2;
    position: relative;
}

.hidden { display: none; }

button {
    background-color: #d63447;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin-top: 15px;
    font-size: 16px;
}
button:hover { background-color: #a52a3c; }

/* ❤️ CORAZONES */
.heart {
    position: fixed;
    bottom: -40px;
    font-size: 22px;
    animation: floatHeart linear infinite;
    pointer-events: none;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
    }
}

/* 🌑 OVERLAY GIFS */
#gif-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

/* 📱 SCROLL HORIZONTAL */
.gif-wrapper {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 20px;
}

.gif-wrapper img {
    width: 240px;
    border-radius: 18px;
    scroll-snap-align: center;
    box-shadow: 0 15px 30px rgba(0,0,0,.5);
}

.swipe-text {
    position: absolute;
    bottom: 40px;
    color: white;
    font-size: 14px;
    opacity: .8;
}
</style>
</head>

<body>

<div class="container">
    <h1>Hola mi niña ❤️</h1>
    <p>Quería hacerte una pregunta.</p>
    <button onclick="showMessage()">Haz clic aquí</button>

    <div id="message" class="hidden">
        <h2>Eres lo mejor que me ha pasado 💖</h2>
        <p>¿Quieres ser mi San Valentine? 😘</p>
        <button onclick="yes()">Sí 💕</button>
        <button onclick="no()">No 😢</button>
    </div>
</div>

<!-- 🌑 POPUP GIFS -->
<div id="gif-overlay" onclick="closeGifs()">
    <div class="gif-wrapper" onclick="event.stopPropagation()">
        <img src="gif1.gif">
        <img src="gif2.gif">
        <img src="gif3.gif">
    </div>
    <div class="swipe-text">Desliza 💕</div>
</div>

<script>
function showMessage() {
    document.getElementById("message").classList.remove("hidden");
}

/* ❤️ CORAZONES SUAVES */
function createHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    heart.style.fontSize = (18 + Math.random() * 18) + "px";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}

function yes() {
    setInterval(createHeart, 200);
    setTimeout(() => {
        document.getElementById("gif-overlay").style.display = "flex";
    }, 1200);
}

function no() {
    alert("Vamos… dime que sí 😘");
}

function closeGifs() {
    document.getElementById("gif-overlay").style.display = "none";
}
</script>

</body>
</html>
